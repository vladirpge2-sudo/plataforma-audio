name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build installable APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare friendly filename
        run: cp app/build/outputs/apk/debug/app-debug.apk VozEmCamadas-Android.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VozEmCamadas-Android
          path: VozEmCamadas-Android.apk
          if-no-files-found: error
      - name: Publish stable direct download
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view android-beta >/dev/null 2>&1; then
            gh release upload android-beta VozEmCamadas-Android.apk --clobber
            gh release edit android-beta \
              --title "Voz em Camadas para Android — Beta" \
              --notes "Versão beta instalável do Voz em Camadas. Requer Android 10 ou superior. Arquivo atualizado automaticamente a partir da main."
          else
            gh release create android-beta VozEmCamadas-Android.apk \
              --target "$GITHUB_SHA" \
              --title "Voz em Camadas para Android — Beta" \
              --notes "Versão beta instalável do Voz em Camadas. Requer Android 10 ou superior."
          fi
