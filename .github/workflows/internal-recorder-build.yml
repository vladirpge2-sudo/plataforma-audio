name: Build Gravador Interno

on:
  workflow_dispatch:
  push:
    branches:
      - agent/internal-recorder-only
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Build APK
        working-directory: recorder-only
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK exists
        run: test -s recorder-only/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare download name
        run: cp recorder-only/app/build/outputs/apk/debug/app-debug.apk GravadorInterno-Android.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GravadorInterno-Android
          path: GravadorInterno-Android.apk
          if-no-files-found: error
